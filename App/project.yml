# Source of truth for App/PGS2SRT.xcodeproj. Never hand-edit project.pbxproj:
# change this file, then run ./scripts/verify-linux.sh (XcodeGen 2.48.0).
# The script generates from a folder named pgs2srt-uniMac (the GitHub repo)
# so the local package's folder reference stays stable. A second run must
# change nothing, and the project must have no TEMP_ object IDs.
# The Xcode project must not sit next to Package.swift, and the package
# must not be named PGS2SRT. Xcode's IDE otherwise reports the products as missing.
name: PGS2SRT
options:
  bundleIdPrefix: com.pgs2srt
  deploymentTarget:
    macOS: "13.0"
  # Off: with `path: .`, intermediate groups leave files under random TEMP_ IDs
  # so every `xcodegen generate` writes a different project (same as mkv-forge L33).
  createIntermediateGroups: false
  defaultConfig: Release
settings:
  # XcodeGen ignores plain keys next to configs:, so project-wide keys go under base:.
  base:
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SDKROOT: macosx
    SUPPORTED_PLATFORMS: macosx
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SWIFT_VERSION: "5.0"
  configs:
    Debug:
      # Do not set ARCHS here. Debug follows the run destination (My Mac),
      # so the app and the package module are the same chip.
      ONLY_ACTIVE_ARCH: YES
    Release:
      ONLY_ACTIVE_ARCH: NO
packages:
  PGSCorePackage:
    path: ..
targets:
  PGS2SRT:
    type: application
    platform: macOS
    sources:
      - path: .
        excludes:
          - "ReviewDelegateProxy/**"
          - "ReviewDelegateProxyTests/**"
          - "P2SUITests/**"
        includes:
          - "*.swift"
          - Info.plist
          - "PGS2SRT-Bridging-Header.h"
      - path: ReviewDelegateProxy
        includes:
          - "*.m"
          - "include/*.h"
      - path: Assets.xcassets
    # App Sandbox stays off. User-selected file access does not let the app
    # create a new .srt next to a dropped .sup, and ad-hoc "Sign to Run Locally"
    # has no provisioning profile for a sandbox entitlement.
    dependencies:
      - package: PGSCorePackage
        product: PGSCore
      - package: PGSCorePackage
        product: VisionOCR
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pgs2srt.PGS2SRT
        PRODUCT_NAME: PGS2SRT
        GENERATE_INFOPLIST_FILE: YES
        # Document types (Blu-ray .sup, folders, and .mkv) live in Info.plist.
        INFOPLIST_FILE: Info.plist
        MARKETING_VERSION: "0.2.1"
        CURRENT_PROJECT_VERSION: "6"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
        ENABLE_HARDENED_RUNTIME: NO
        INFOPLIST_KEY_CFBundleDisplayName: PGS2SRT
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_OBJC_BRIDGING_HEADER: PGS2SRT-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/ReviewDelegateProxy/include"
        ENABLE_PREVIEWS: YES
        MACOSX_DEPLOYMENT_TARGET: "13.0"
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
        Release:
          ONLY_ACTIVE_ARCH: NO
          ARCHS: [arm64, x86_64]
    scheme:
      gatherCoverageData: false
  pgs2srt:
    type: tool
    platform: macOS
    sources:
      - path: ../Sources/pgs2srt
    dependencies:
      - package: PGSCorePackage
        product: PGSCore
      - package: PGSCorePackage
        product: VisionOCR
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pgs2srt.pgs2srt
        PRODUCT_NAME: pgs2srt
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.2.1"
        CURRENT_PROJECT_VERSION: "6"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
        ENABLE_HARDENED_RUNTIME: NO
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path"
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
        Release:
          ONLY_ACTIVE_ARCH: NO
          ARCHS: [arm64, x86_64]
  PGS2SRTUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: P2SUITests
    dependencies:
      - target: PGS2SRT
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pgs2srt.PGS2SRTUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PGS2SRT
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
schemes:
  PGS2SRT-UITests:
    build:
      targets:
        PGS2SRT: all
        PGS2SRTUITests: [test]
    test:
      targets:
        - PGS2SRTUITests
  pgs2srt-cli:
    build:
     targets:
      pgs2srt: all
