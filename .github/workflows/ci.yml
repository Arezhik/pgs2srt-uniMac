name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux tests
    runs-on: ubuntu-latest
    container:
      image: swift:6.2.4
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Test
        run: swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Build command-line tools
        run: swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: pgs2srt on Linux explains it needs a Mac
        shell: bash
        run: |
          set -euo pipefail
          .build/debug/pgs2srt --help | grep -q "Apple Vision"
          set +e
          stderr=$(.build/debug/pgs2srt sample.sup 2>&1)
          code=$?
          set -e
          test "$code" -eq 1
          echo "$stderr" | grep -q "only runs on macOS"

  macos-tests:
    name: macOS tests
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Test
        run: swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

  macos:
    name: macOS universal app
    # Xcode 27 matches the Mac where Debug failed. The hosted macOS 27 image
    # throws nilError from VNRecognizeTextRequest, so the Vision tests stay on
    # macos-latest. This job checks the app build.
    runs-on: xcode-27
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Xcode version
        run: xcodebuild -version

      - name: Resolve local package
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/build" "$GITHUB_WORKSPACE/.build"
          set +e
          LOG=$(xcodebuild \
            -resolvePackageDependencies \
            -project App/PGS2SRT.xcodeproj \
            -scheme PGS2SRT \
            -derivedDataPath "$GITHUB_WORKSPACE/build" 2>&1)
          code=$?
          set -e
          echo "$LOG"
          test "$code" -eq 0
          echo "$LOG" | grep -q "PGS2SRTKit"
          echo "$LOG" | grep -qi "resolved source packages"
          if echo "$LOG" | grep -q "Missing package product"; then
            echo "Package products did not bind"
            exit 1
          fi

      - name: Build Debug app
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/build-debug"
          xcodebuild \
            -project App/PGS2SRT.xcodeproj \
            -scheme PGS2SRT \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$GITHUB_WORKSPACE/build-debug" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          BIN="$GITHUB_WORKSPACE/build-debug/Build/Products/Debug/PGS2SRT.app/Contents/MacOS/PGS2SRT"
          if [ ! -f "$BIN" ]; then
            BIN="$(find "$GITHUB_WORKSPACE/build-debug" -type f -path '*/Debug/PGS2SRT.app/Contents/MacOS/PGS2SRT' | head -1)"
          fi
          test -f "$BIN"
          lipo -info "$BIN"
          ARCHS="$(lipo -archs "$BIN")"
          echo "Debug architectures: $ARCHS"
          echo "$ARCHS" | grep -qw arm64
          if echo "$ARCHS" | grep -qw x86_64; then
            echo "Debug My Mac build included Intel. ONLY_ACTIVE_ARCH should keep it to arm64."
            exit 1
          fi
          MOD="$(find "$GITHUB_WORKSPACE/build-debug" -path '*PGSCore.swiftmodule/arm64-apple-macos.swiftmodule')"
          test -n "$MOD"
          INTEL="$(find "$GITHUB_WORKSPACE/build-debug" -path '*PGSCore.swiftmodule/*x86_64*' || true)"
          if [ -n "$INTEL" ]; then
            echo "Debug PGSCore module was built for a second architecture"
            exit 1
          fi

      - name: Build universal app
        run: |
          xcodebuild \
            -project App/PGS2SRT.xcodeproj \
            -scheme PGS2SRT \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify both architectures and zip
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/build/Build/Products/Release/PGS2SRT.app"
          if [ ! -d "$APP" ]; then
            APP="$(find "$GITHUB_WORKSPACE/build" -type d -name 'PGS2SRT.app' | head -1)"
          fi
          test -d "$APP"
          BIN="$APP/Contents/MacOS/PGS2SRT"
          test -f "$BIN"
          lipo -info "$BIN"
          ARCHS="$(lipo -archs "$BIN")"
          echo "Architectures: $ARCHS"
          echo "$ARCHS" | grep -qw arm64
          echo "$ARCHS" | grep -qw x86_64
          INFO="$APP/Contents/Info.plist"
          test -f "$INFO"
          plutil -extract CFBundleIdentifier raw "$INFO" | grep -qx com.pgs2srt.PGS2SRT
          plutil -extract CFBundleDocumentTypes.0.CFBundleTypeExtensions.0 raw "$INFO" | grep -qx sup
          plutil -extract CFBundleDocumentTypes.1.LSItemContentTypes.0 raw "$INFO" | grep -qx public.folder
          plutil -extract UTImportedTypeDeclarations.0.UTTypeIdentifier raw "$INFO" | grep -qx com.pgs2srt.pgs-subtitle
          ENTS="$(codesign -d --entitlements :- "$APP" 2>/dev/null || true)"
          if printf '%s' "$ENTS" | grep -q 'com.apple.security.app-sandbox'; then
            echo "App Sandbox should stay off so the .srt can be written next to a dropped .sup"
            exit 1
          fi
          ditto -c -k --keepParent "$APP" "$GITHUB_WORKSPACE/PGS2SRT-universal.zip"
          test -s "$GITHUB_WORKSPACE/PGS2SRT-universal.zip"

      - name: Build universal command-line tool
        run: |
          set -euo pipefail
          xcodebuild \
            -project App/PGS2SRT.xcodeproj \
            -scheme pgs2srt \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build-cli" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          BIN="$GITHUB_WORKSPACE/build-cli/Build/Products/Release/pgs2srt"
          if [ ! -f "$BIN" ]; then
            BIN="$(find "$GITHUB_WORKSPACE/build-cli" -type f -name 'pgs2srt' -perm -111 | head -1)"
          fi
          test -f "$BIN"
          lipo -info "$BIN"
          ARCHS="$(lipo -archs "$BIN")"
          echo "pgs2srt architectures: $ARCHS"
          echo "$ARCHS" | grep -qw arm64
          echo "$ARCHS" | grep -qw x86_64

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          path: PGS2SRT-universal.zip
          if-no-files-found: error
          archive: false
